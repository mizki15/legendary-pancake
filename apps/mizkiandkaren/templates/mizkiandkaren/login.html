{% extends "mizkiandkaren/base.html" %}
{% block title %}ログイン | M＆K{% endblock %}
{% block content %}
<section class="login-layout">
  <h1 class="visually-hidden">ログイン</h1>
  <div class="login-intro login-art" aria-hidden="true"><img src="{{ url_for('mizkiandkaren.static', filename='images/bouquet.webp') }}" width="360" height="540" alt=""></div>
  <div class="login-sheet">
    <h2>Welcome back</h2><p class="muted">合言葉を入れて、手帳を開こう。</p>
    {% if configured %}
    <form method="post" class="stack" action="{{ url_for('mizkiandkaren.login') }}">
      <input type="hidden" name="login_token" value="{{ login_token }}"><input type="hidden" name="next" value="{{ next_path }}">
      <label class="field">ふたりの合言葉<input type="text" name="passphrase" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" required maxlength="512" autofocus aria-describedby="login-error" {% if error %}aria-invalid="true"{% endif %}></label>
      <label class="check-label"><input type="checkbox" name="remember">この端末で30日間ログインを保つ</label>
      <p id="login-error" class="form-error" role="alert">{{ error }}</p>
      <button type="submit" class="button primary">{{ icon('book') }}手帳を開く</button>
    </form>
    {% else %}<p class="form-error" role="status">{{ error }}</p>{% endif %}
  </div>
</section>
{% endblock %}
